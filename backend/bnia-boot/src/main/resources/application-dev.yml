# Profil de développement : PostgreSQL et Mailpit de backend/compose.yaml, démarrés au besoin (ADR-003).
# Dans un worktree, backend/.env (worktree-env.sh, ignoré par git) donne ses propres ports : lu ici
# (répertoire de travail bnia-boot) et par Docker Compose. Absent : valeurs par défaut.
spring:
  config:
    import: optional:file:../.env[.properties]
  docker:
    compose:
      enabled: true
      file: ../compose.yaml
      lifecycle-management: start-only
  devtools:
    # Le front est servi par Vite (pnpm dev), qui recharge lui-même la page.
    livereload:
      enabled: false
  flyway:
    # Vidage autorisé en dev seulement : la base est recréée si V1 a changé (MigrationDevConfiguration).
    clean-disabled: false
  # E-mails captés par Mailpit (H-AUT-3) : http://localhost:8025 (BNIA_MAILPIT_PORT pour une seconde instance).
  mail:
    host: localhost
    port: ${BNIA_SMTP_PORT:1025}

server:
  port: ${SERVER_PORT:8080}

bnia:
  authentification:
    # RG-AUT-01 : en dev, le code de connexion vaut toujours 000000.
    code-fixe: "000000"
  # Export du suivi de l'utilisation : jeton fixe en dev, celui que ./suivi.sh utilise pour l'instance locale.
  suivi:
    jeton: ${BNIA_SUIVI_JETON:dev}

logging:
  level:
    fr.bnia: debug
