<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="Inter Variable, Noto Sans, sans-serif">
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a5b1e"/>
    </marker>
    <style>
      .groupe { fill: #f7efe5; stroke: #e6dccf; }
      .tiers { fill: #fff; stroke: #c9bcab; stroke-dasharray: 4 3; }
      .boite { fill: #fff; stroke: #c9a27a; }
      .agregat { fill: #fff; stroke: #9a5b1e; stroke-width: 1.3; }
      .titre-groupe { font-size: 11.5px; font-weight: 650; fill: #6e3f12; }
      .sous-groupe { font-size: 8px; fill: #7a6f66; }
      .nom { font-size: 9.5px; font-weight: 650; fill: #241f1b; }
      .nom-discret { font-size: 9px; font-weight: 650; fill: #5a504a; }
      .detail { font-size: 7.8px; fill: #5a504a; }
      .lien { stroke: #9a5b1e; stroke-width: 1.2; fill: none; }
      .etiquette { font-size: 7.5px; fill: #9a5b1e; font-weight: 600; }
    </style>
  </defs>

  <!-- DSM -->
  <rect class="groupe" x="0" y="0" width="316" height="340" rx="8"/>
  <text class="titre-groupe" x="12" y="18">DSM</text>
  <text class="sous-groupe" x="44" y="18">une par opérateur et par période · au plus une non validée</text>

  <rect class="agregat" x="12" y="28" width="292" height="70" rx="5"/>
  <text class="detail" x="22" y="43">opérateur ; type de déclarant : producteur ou négociant, figé à l’initiation</text>
  <text class="detail" x="22" y="55">période : début, fin (1er avril – 31 mars, ou mois civil)</text>
  <text class="detail" x="22" y="67">état : brouillon, envoyée, en instruction, compléments demandés,</text>
  <text class="detail" x="22" y="79">compléments reçus, validée ; date de DIA (facultative)</text>
  <text class="detail" x="22" y="91">envoyée le ; validée le, par ; version (modifications simultanées)</text>

  <rect class="boite" x="12" y="106" width="292" height="84" rx="5"/>
  <text class="nom" x="22" y="121">Lignes</text>
  <text class="detail" x="22" y="134">clé de conditionnement : MB, MV, NB, NV</text>
  <text class="detail" x="22" y="145">millésime (clé M) ou dénomination (clé N)</text>
  <text class="detail" x="22" y="156">compte d’âge : 00, 0, 1 … 19, 20+ ; origine : reprise ou ajout</text>
  <text class="detail" x="22" y="167">volumes des colonnes 1 à 25, en litres d’alcool pur</text>
  <text class="detail" x="22" y="178">stock de fin (colonne 26) : calculé, jamais saisi</text>

  <rect class="boite" x="12" y="198" width="292" height="72" rx="5"/>
  <text class="nom" x="22" y="213">Justificatifs</text>
  <text class="detail" x="22" y="226">PDF rattaché à la DSM ou à une de ses lignes</text>
  <text class="detail" x="22" y="237">type de mouvement : achat, vente négoce, vente export,</text>
  <text class="detail" x="22" y="248">réintégration, autres fabrications ; type de pièce : facture,</text>
  <text class="detail" x="22" y="259">DAE, avoir, déclaration de fabrication ; réf. DAE/DAI ; déposé par, le</text>
  <path class="lien" d="M290,190 L290,198" />
  <text class="etiquette" x="226" y="213">ligne (facultative)</text>

  <rect class="boite" x="12" y="278" width="140" height="52" rx="5"/>
  <text class="nom" x="22" y="293">DRM (producteur)</text>
  <text class="detail" x="22" y="306">une par mois de la période</text>
  <text class="detail" x="22" y="317">PDF ; déposée par, le</text>

  <rect class="boite" x="162" y="278" width="142" height="52" rx="5"/>
  <text class="nom" x="172" y="293">Notes internes</text>
  <text class="detail" x="172" y="306">BNIA seul ; DSM ou ligne</text>
  <text class="detail" x="172" y="317">auteur, écrite le, modifiée le</text>

  <!-- Point de départ, grille, journal -->
  <rect class="agregat" x="336" y="0" width="160" height="100" rx="6"/>
  <text class="nom" x="346" y="16">Point de départ</text>
  <text class="sous-groupe" x="346" y="28">fixé par le BNIA</text>
  <text class="detail" x="346" y="42">opérateur ; début : 1er avril</text>
  <text class="detail" x="346" y="53">(producteur), 1er du mois (négociant)</text>
  <text class="detail" x="346" y="64">lignes de stock initial : clé,</text>
  <text class="detail" x="346" y="75">millésime ou dénomination,</text>
  <text class="detail" x="346" y="86">compte d’âge, volume ; un en vigueur</text>

  <rect class="agregat" x="336" y="112" width="160" height="78" rx="6"/>
  <text class="nom" x="346" y="128">Grille de cotisation</text>
  <text class="sous-groupe" x="346" y="140">tenue par le BNIA</text>
  <text class="detail" x="346" y="154">taux CVO : montant en €/hlAP,</text>
  <text class="detail" x="346" y="165">% exonéré de TVA, début ;</text>
  <text class="detail" x="346" y="176">fin = veille du taux suivant</text>

  <rect class="boite" x="336" y="202" width="160" height="58" rx="6"/>
  <text class="nom" x="346" y="218">Journal</text>
  <text class="detail" x="346" y="231">ajout seul : date, acteur,</text>
  <text class="detail" x="346" y="242">action, détail ; jamais de</text>
  <text class="detail" x="346" y="253">valeur avant ou après</text>

  <rect class="tiers" x="336" y="278" width="160" height="52" rx="6"/>
  <text class="nom-discret" x="346" y="293">Opérateur</text>
  <text class="detail" x="346" y="306">module Opérateurs : type,</text>
  <text class="detail" x="346" y="317">statut de déclaration, droits</text>

  <!-- Calculs -->
  <rect class="groupe" x="514" y="0" width="146" height="260" rx="8"/>
  <text class="titre-groupe" x="524" y="18">Calculs</text>
  <text class="sous-groupe" x="524" y="30">sans donnée propre</text>
  <rect class="boite" x="522" y="38" width="130" height="48" rx="5"/>
  <text class="nom" x="530" y="52">Calendrier</text>
  <text class="detail" x="530" y="65">période suivante,</text>
  <text class="detail" x="530" y="76">échéance, retard</text>
  <rect class="boite" x="522" y="92" width="130" height="48" rx="5"/>
  <text class="nom" x="530" y="106">Vieillissement</text>
  <text class="detail" x="530" y="119">compte d’âge au 1er avril,</text>
  <text class="detail" x="530" y="130">fusion des lignes</text>
  <rect class="boite" x="522" y="146" width="130" height="48" rx="5"/>
  <text class="nom" x="530" y="160">Contrôles</text>
  <text class="detail" x="530" y="173">anomalies (envoi), pièces</text>
  <text class="detail" x="530" y="184">manquantes (validation)</text>
  <rect class="boite" x="522" y="200" width="130" height="52" rx="5"/>
  <text class="nom" x="530" y="214">Cotisation</text>
  <text class="detail" x="530" y="227">assiette × taux en vigueur</text>
  <text class="detail" x="530" y="238">en fin de période, une ligne</text>
  <text class="detail" x="530" y="249">par ligne de facture</text>

  <rect class="tiers" x="514" y="278" width="146" height="52" rx="6"/>
  <text class="nom-discret" x="524" y="293">Facture</text>
  <text class="detail" x="524" y="306">module Facturation : référence</text>
  <text class="detail" x="524" y="317">la DSM, une seule vivante</text>

  <!-- Liens -->
  <path class="lien" d="M336,50 L316,50" marker-end="url(#fleche)"/>
  <path class="lien" d="M496,151 L522,226" marker-end="url(#fleche)"/>
  <path class="lien" d="M316,304 L336,304" marker-end="url(#fleche)"/>
  <path class="lien" d="M514,304 L506,304 L506,274 L316,274" marker-end="url(#fleche)"/>
</svg>
