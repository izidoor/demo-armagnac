<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BNIA : pas de connexion</title>
    <style>
      :root {
        color-scheme: light dark;
        --fond: #ffffff;
        --texte: #0f172a;
        --discret: #64748b;
        --bouton: #0f172a;
        --bouton-texte: #f8fafc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fond: #020817;
          --texte: #f8fafc;
          --discret: #94a3b8;
          --bouton: #e2e8f0;
          --bouton-texte: #0f172a;
        }
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--fond);
        color: var(--texte);
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 16px 0 8px;
      }
      p {
        color: var(--discret);
        margin: 0 0 24px;
        max-width: 22rem;
      }
      button {
        font: inherit;
        border: 0;
        border-radius: 6px;
        padding: 10px 20px;
        background: var(--bouton);
        color: var(--bouton-texte);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3" />
      </svg>
      <h1>Pas de connexion</h1>
      <p>Le BNIA a besoin du réseau pour afficher vos données. Vérifiez votre connexion, puis réessayez.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
